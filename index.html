    <script>
      (function() {
        // Prevent SecurityError when window.localStorage is blocked in sandboxed / cross-origin iframes
        try {
          var test = '__test_st__';
          window.localStorage.setItem(test, test);
          window.localStorage.removeItem(test);
        } catch (e) {
          var createMockStorage = function() {
            var s = {};
            return {
              getItem: function(k) { return Object.prototype.hasOwnProperty.call(s, k) ? s[k] : null; },
              setItem: function(k, v) { s[k] = String(v); },
              removeItem: function(k) { delete s[k]; },
              clear: function() { s = {}; },
              get length() { return Object.keys(s).length; },
              key: function(i) { return Object.keys(s)[i] || null; }
            };
          };
          try { Object.defineProperty(window, 'localStorage', { value: createMockStorage(), configurable: true }); } catch (_) {}
          try { Object.defineProperty(window, 'sessionStorage', { value: createMockStorage(), configurable: true }); } catch (_) {}
        }
      })();
    </script>
